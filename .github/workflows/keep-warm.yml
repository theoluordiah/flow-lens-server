# Pings the Render free-tier API so it doesn't cold-start (30-60s) during a demo.
# Set the repo variable FLOWLENS_API_URL (Settings → Secrets and variables → Actions → Variables).
# GitHub may delay scheduled runs by a few minutes; also open the app yourself right before presenting.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.FLOWLENS_API_URL != '' }}
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 "${{ vars.FLOWLENS_API_URL }}/health"
